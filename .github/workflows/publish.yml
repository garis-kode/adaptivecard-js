name: Publish

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA or branch to publish; empty means the triggering ref"
        required: false
        default: ""
        type: string
      version:
        description: "Version being released, without the leading v; must equal package.json version"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Stage npm package for approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package.json version matches the release version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_VERSION="${TARGET_VERSION#v}"
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::package.json version '$PKG_VERSION' does not match release version '$EXPECTED_VERSION'."
            exit 1
          fi
        env:
          TARGET_VERSION: ${{ inputs.version }}

      - name: Run checks
        run: bun run check

      - name: Run package artifact
        run: bun run test:pack

      - name: Verify
        run: |
          npm view adaptivecard-js@$(node -p "require('./package.json').version") version && exit 1 || true

      - name: Stage
        run: npm stage publish
