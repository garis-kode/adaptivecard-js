name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
permissions:
  contents: read

jobs:
  tests:
    if: ${{ !github.event.pull_request.draft }}
    name: Bun Tests, Typecheck & Package Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full check (format, typecheck, tests, build)
        run: bun run check

      - name: Run package artifact & consumer smoke tests
        run: bun run test:pack
