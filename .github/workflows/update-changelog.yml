name: Update Changelog

on:
  workflow_call:
    inputs:
      branch:
        description: "Target branch"
        default: "main"
        type: string
      version:
        description: "Released version"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: true
        type: string
    outputs:
      ref:
        description: "Commit SHA holding the changelog update (branch tip when nothing changed)"
        value: ${{ jobs.update.outputs.ref }}
      date:
        description: "Release date written into CHANGELOG.md"
        value: ${{ jobs.update.outputs.date }}

permissions:
  contents: write

concurrency:
  group: changelog-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: Update Changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.publish-ref.outputs.ref }}
      date: ${{ steps.release_date.outputs.date }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Extract release date from git tag
        id: release_date
        run: |
          TIMESTAMP_OF_RELEASE_COMMIT=$(git log -1 --date=unix --format=%cd "$INPUT_VERSION" 2>/dev/null || date +%s)
          FORMATTED_DATE=$(date -u -d @"$TIMESTAMP_OF_RELEASE_COMMIT" +%Y-%m-%d)
          echo "date=$FORMATTED_DATE" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          release-date: ${{ steps.release_date.outputs.date }}
          release-notes: ${{ inputs.notes }}
          latest-version: ${{ inputs.version }}
          compare-url-target-revision: ${{ inputs.branch }}
          parse-github-usernames: true

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          branch: ${{ inputs.branch }}
          commit_message: "docs(changelog): update for ${{ inputs.version }}"
          file_pattern: CHANGELOG.md

      - name: Resolve publish ref
        id: publish-ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
